<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tài khoản VQSV</title>
    <style>
      :root { color-scheme: dark; font: 1rem system-ui, sans-serif; }
      body { margin: 0 auto; padding: 1.25rem; max-width: 26rem; }
      form, label { display: grid; gap: .5rem; }
      form { gap: 1rem; }
      input, button { font: inherit; padding: .55rem; }
      button { cursor: pointer; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tài khoản VQSV</h1>
      <p id="message" role="status"></p>
      <form hidden>
        <label>Email <input type="email" name="email" autocomplete="username" required maxlength="128" /></label>
        <label>Mật khẩu <input type="password" name="password" autocomplete="current-password" required minlength="8" maxlength="128" /></label>
        <label id="confirmation" hidden>Nhập lại mật khẩu <input type="password" name="confirm" autocomplete="new-password" maxlength="128" /></label>
        <button type="submit">Đăng nhập</button>
        <button type="button" id="switch">Đăng ký</button>
      </form>
      <section id="signed-in" hidden>
        <p id="email"></p>
        <p><a href="/">Vào game</a></p>
        <button type="button" id="logout">Đăng xuất</button>
      </section>
    </main>
    <script type="module" src="/src/account-page.ts"></script>
  </body>
</html>
