# VQSV ProMax on this server: `docker compose -f deploy/compose.yaml up -d --build` from the repo.
# backend: accounts, sessions, saves and admin (/api/*) on SQLite. web: Caddy with HTTPS serving the
# game built from this repo and passing /api/* to the backend.
name: vqsv-promax-app
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_ORIGIN: https://hoisinhvqsv.online
      DB_PATH: /data/game.sqlite
    volumes:
      - game_data:/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: { condition: service_healthy }
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
# The players' database and Caddy's certificates are the volumes the first deployment
# (/opt/vqsv-promax) made, so accounts, saves and HTTPS carry over.
volumes:
  game_data:
    external: true
    name: vqsv-promax_game_data
  caddy_data:
    external: true
    name: vqsv-promax_caddy_data
  caddy_config:
    external: true
    name: vqsv-promax_caddy_config
